name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]  # oldest supported (pyproject) and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install PyQt6
      - run: sudo apt-get install -y libegl1 libxkbcommon0
      - run: python -m py_compile powerstar/*.py powerstar/ui/*.py
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
      - if: hashFiles('powerstar/man/powerstar.1') != ''
        run: sudo apt-get install -y mandoc && mandoc -Tlint -Wwarning powerstar/man/*
